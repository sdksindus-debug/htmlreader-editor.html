<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber Runner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090710;
            --bg-deep: #0d0221;
            --bg-panel: #130b2b;
            --panel-edge: #D9C640;
            --panel-edge-strong: #FCE957;
            --gold: #D9C640;
            --gold-bright: #FCE957;
            --gold-lime: #CECE06;
            --green: #09AF0B;
            --red: #B90A1A;
            --red-deep: #95222C;
            --text-dark: #0d0221;
            --text-soft: #F4ED9A;
            --cell-bg: rgba(255, 255, 255, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            position: relative;
            font-family: 'Share Tech Mono', monospace;
            background:
                linear-gradient(180deg, rgba(14, 5, 28, 0.98), rgba(9, 7, 16, 1)),
                var(--bg-base);
            color: var(--gold-bright);
            overflow: hidden;
        }

        body::before {
            content: " ";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(220, 210, 95, 0.14) 0,
                    rgba(220, 210, 95, 0.14) 1px,
                    transparent 1px,
                    transparent 18px
                ),
                repeating-linear-gradient(
                    to right,
                    rgba(220, 210, 95, 0.14) 0,
                    rgba(220, 210, 95, 0.14) 1px,
                    transparent 1px,
                    transparent 18px
                );
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: " ";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(252, 233, 87, 0.09), transparent 58%);
            pointer-events: none;
            z-index: 0;
        }

        header,
        .container,
        .panel,
        textarea,
        iframe {
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #1a0842 0%, #2a085c 100%);
            padding: 14px 20px;
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 0 18px rgba(217, 198, 64, 0.5);
        }

        h1 {
            font-size: 1.55rem;
            letter-spacing: 3px;
            color: var(--gold-bright);
            text-shadow: 0 0 8px rgba(252, 233, 87, 0.9), 0 0 22px rgba(217, 198, 64, 0.7);
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-retro {
            background: #0a0717;
            color: var(--gold-bright);
            border: 2px solid var(--gold);
            padding: 7px 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(217, 198, 64, 0.3);
            transition: all 0.18s ease;
        }

        .btn-retro:hover {
            background: var(--gold-bright);
            color: var(--text-dark);
            box-shadow: 0 0 18px rgba(252, 233, 87, 0.9), 0 0 28px rgba(217, 198, 64, 0.6);
        }

        .btn-retro.btn-save {
            border-color: var(--gold-lime);
            color: var(--gold-lime);
            box-shadow: 0 0 10px rgba(206, 206, 6, 0.28);
        }

        .btn-retro.btn-save:hover {
            background: var(--gold-lime);
            color: var(--text-dark);
            box-shadow: 0 0 18px rgba(206, 206, 6, 0.9), 0 0 28px rgba(206, 206, 6, 0.6);
        }

        #file-input {
            display: none;
        }

        .container {
            display: flex;
            height: calc(100vh - 78px);
            gap: 14px;
            padding: 14px;
            background: radial-gradient(circle at center, rgba(217, 198, 64, 0.07), rgba(9, 7, 16, 0.9) 50%, rgba(9, 7, 16, 1));
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: rgba(15, 7, 27, 0.85);
            border: 2px solid var(--panel-edge);
            box-shadow: 0 0 15px rgba(217, 198, 64, 0.35);
        }

        .panel-title {
            padding: 8px 12px;
            background: rgba(26, 8, 66, 0.9);
            border-bottom: 2px solid var(--panel-edge);
            color: var(--gold-bright);
            letter-spacing: 2px;
            font-size: 1.05rem;
            text-shadow: 0 0 6px rgba(252, 233, 87, 0.55);
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 14px;
            border: none;
            resize: none;
            outline: none;
            background: rgba(7, 1, 20, 0.9);
            color: #D1C65F;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.22rem;
            line-height: 1.5;
            text-shadow: 0 0 2px rgba(217, 198, 64, 0.35);
        }

        textarea::-webkit-scrollbar {
            width: 9px;
        }

        textarea::-webkit-scrollbar-track {
            background: rgba(7, 1, 20, 0.9);
        }

        textarea::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--gold), var(--gold-lime));
            border-radius: 6px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>// NEON_MATRIX_V1.09</h1>
        <div class="action-group">
            <input type="file" id="file-input" accept=".html,.htm,.txt" onchange="loadFile(event)">
            <button class="btn-retro" onclick="triggerFileOpen()">Load Segment</button>
            <button class="btn-retro btn-save" onclick="saveFile()">Compile .HTML</button>
            <button class="btn-retro" onclick="runCode()">Execute Code</button>
        </div>
    </header>

    <div class="container">
        <div class="panel">
            <div class="panel-title">&gt; SOURCE_STREAM</div>
            <textarea id="code-input" spellcheck="false" placeholder="Awaiting matrix payload..."><!-- Example code -->

        <div class="panel">
            <div class="panel-title">&gt; VISUAL_MATRIX_RENDER</div>
            <iframe id="output-preview"></iframe>
        </div>
    </div>

    <script>
        function runCode() {
            const code = document.getElementById('code-input').value;
            const previewFrame = document.getElementById('output-preview');
            const innerDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;

            innerDoc.open();
            innerDoc.write(code);
            innerDoc.close();
        }

        function triggerFileOpen() {
            document.getElementById('file-input').click();
        }

        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('code-input').value = e.target.result;
                runCode();
            };
            reader.readAsText(file);
        }

        function saveFile() {
            const code = document.getElementById('code-input').value;
            const blob = new Blob([code], { type: 'text/html' });
            const link = document.createElement('a');

            link.download = `build_${Date.now()}.html`;
            link.href = URL.createObjectURL(blob);

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('code-input').addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });

        window.onload = runCode;
    </script>
</body>
</html>
