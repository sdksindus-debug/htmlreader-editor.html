<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber Runner</title>
    <!-- Importing a stylized digital matrix font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d0221;
            --bg-panel: #1a0842;
            --panel-border: #BAAA44;
            --grid-gold: #D9C640;
            --bright-yellow: #FCF957;
            --lime: #CECE06;
            --muted-gold: #BAAA44;
            --soft-gold: #E3D050;
            --deep-red: #95222C;
            --green: #09AF0B;
            --text-ink: #0d0221;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
            color: var(--bright-yellow);
            overflow: hidden;
        }
        /* Grid overlay simulating 90s digital synthetic horizons */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: 
                linear-gradient(rgba(13, 2, 33, 0.4) 50%, rgba(255, 0, 127, 0.1) 50%),
                linear-gradient(90deg, rgba(217, 198, 64, 0.05), rgba(0, 0, 0, 0), rgba(9, 175, 11, 0.05));
            z-index: 10;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
        }
        header {
            background: linear-gradient(90deg, #1a0842 0%, #2a085c 100%);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--deep-red);
            box-shadow: 0 4px 20px rgba(217, 198, 64, 0.35);
        }
        h1 {
            font-size: 1.6rem;
            letter-spacing: 3px;
            color: var(--bright-yellow);
            text-shadow: 0 0 8px var(--bright-yellow), 0 0 20px rgba(252, 249, 87, 0.45);
        }
        .action-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-retro {
            background-color: var(--bg-deep);
            color: var(--bright-yellow);
            border: 2px solid var(--grid-gold);
            padding: 6px 18px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(217, 198, 64, 0.25);
            transition: all 0.2s ease;
        }
        .btn-retro:hover {
            background-color: var(--grid-gold);
            color: var(--text-ink);
            box-shadow: 0 0 15px var(--grid-gold), 0 0 25px rgba(217, 198, 64, 0.5);
        }
        .btn-retro.btn-save {
            border-color: var(--green);
            color: var(--green);
            box-shadow: 0 0 8px rgba(9, 175, 11, 0.3);
        }
        .btn-retro.btn-save:hover {
            background-color: var(--green);
            color: var(--text-ink);
            box-shadow: 0 0 15px var(--green), 0 0 25px rgba(9, 175, 11, 0.5);
        }
        #file-input {
            display: none;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 15px;
            gap: 15px;
            background: radial-gradient(circle at center, rgba(186, 170, 68, 0.15) 0%, var(--bg-deep) 100%);
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 2px solid var(--panel-border);
            background-color: rgba(15, 4, 41, 0.85);
            box-shadow: 0 0 15px rgba(186, 170, 68, 0.25);
            border-radius: 4px;
        }
        .panel-title {
            background-color: var(--bg-panel);
            padding: 6px 14px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--bright-yellow);
            border-bottom: 2px solid var(--panel-border);
            text-shadow: 0 0 5px rgba(252, 249, 87, 0.5);
        }
        textarea {
            flex: 1;
            background-color: #070114;
            color: var(--soft-gold);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.3rem;
            padding: 15px;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.4;
            text-shadow: 0 0 2px rgba(217, 198, 64, 0.4);
        }
        /* Synthwave custom scrollbar */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #070114;
        }
        textarea::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 4px;
        }
        iframe {
            flex: 1;
            background-color: #ffffff;
            border: none;
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>// NEON_MATRIX_V1.09</h1>
        <div class="action-group">
            <input type="file" id="file-input" accept=".html,.htm,.txt" onchange="loadFile(event)">
            
            <button class="btn-retro" onclick="triggerFileOpen()">Load Segment</button>
            <button class="btn-retro btn-save" onclick="saveFile()">Compile .HTML</button>
            <button class="btn-retro" onclick="runCode()">Execute Code</button>
        </div>
    </header>

    <div class="container">
        <!-- Source Input Matrix -->
        <div class="panel">
            <div class="panel-title">&gt; SOURCE_STREAM</div>
            <textarea id="code-input" spellcheck="false" placeholder="Awaiting matrix payload..."><!-- Example code -->

        </div>

        <!-- Render Target Frame -->
        <div class="panel">
            <div class="panel-title">&gt; VISUAL_MATRIX_RENDER</div>
            <iframe id="output-preview"></iframe>
        </div>
    </div>

    <script>
        function runCode() {
            const code = document.getElementById('code-input').value;
            const previewFrame = document.getElementById('output-preview');
            const innerDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            
            innerDoc.open();
            innerDoc.write(code);
            innerDoc.close();
        }

        function triggerFileOpen() {
            document.getElementById('file-input').click();
        }

        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('code-input').value = e.target.result;
                runCode();
            };
            reader.readAsText(file);
        }

        function saveFile() {
            const code = document.getElementById('code-input').value;
            const blob = new Blob([code], { type: 'text/html' });
            const link = document.createElement('a');
            
            link.download = `build_${Date.now()}.html`;
            link.href = URL.createObjectURL(blob);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('code-input').addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
        });

        window.onload = runCode;
    </script>
</body>
</html>
